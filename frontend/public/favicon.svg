<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Fondo circular suave verde tienda -->
  <circle cx="60" cy="60" r="56" fill="#22c55e" stroke="#15803d" stroke-width="4" />

  <!-- Orejas del gato naranja -->
  <path d="M28 52 L22 22 L48 36 Z" fill="#f97316" stroke="#7c2d12" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M92 52 L98 22 L72 36 Z" fill="#f97316" stroke="#7c2d12" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Interior de las orejas -->
  <path d="M30 46 L26 28 L43 38 Z" fill="#fed7aa" />
  <path d="M90 46 L94 28 L77 38 Z" fill="#fed7aa" />

  <!-- Cabeza del gato -->
  <ellipse cx="60" cy="62" rx="36" ry="30" fill="#f97316" stroke="#7c2d12" stroke-width="3.5" />

  <!-- Manchas atigradas en la frente -->
  <path d="M54 33 L54 42 M60 32 L60 44 M66 33 L66 42" stroke="#c2410c" stroke-width="3" stroke-linecap="round" />

  <!-- Hocico blanco -->
  <path d="M40 68 Q60 55 80 68 Q76 86 60 86 Q44 86 40 68 Z" fill="#ffffff" />

  <!-- Ojos -->
  <circle cx="44" cy="58" r="4.5" fill="#431407" />
  <circle cx="76" cy="58" r="4.5" fill="#431407" />
  <circle cx="42.5" cy="56.5" r="1.5" fill="#ffffff" />
  <circle cx="74.5" cy="56.5" r="1.5" fill="#ffffff" />

  <!-- Nariz y boca -->
  <path d="M56 66 L64 66 L60 71 Z" fill="#fb7185" />
  <path d="M60 71 Q54 76 50 72 M60 71 Q66 76 70 72" fill="none" stroke="#431407" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bigotes -->
  <path d="M22 62 L35 64 M20 69 L35 69 M98 62 L85 64 M100 69 L85 69" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />

  <!-- Pañuelo/Etiqueta de tienda en el cuello -->
  <path d="M34 86 Q60 96 86 86 L74 106 L60 112 L46 106 Z" fill="#facc15" stroke="#7c2d12" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Iniciales NV en el pañuelo -->
  <text x="60" y="103" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#15803d" text-anchor="middle">NV</text>
</svg>